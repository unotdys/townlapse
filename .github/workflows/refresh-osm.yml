name: Refresh today's businesses (OpenStreetMap)
on:
  schedule:
    - cron: "17 12 * * 1"   # Mondays
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: map-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_osm.py
      - run: python scripts/build.py
      - id: commit
        run: |
          git config user.name "map-bot"; git config user.email "map-bot@users.noreply.github.com"
          git add data/osm_current.json data/geocache.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Refresh today's businesses from OpenStreetMap" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
